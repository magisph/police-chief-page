<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0D1117" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Gerenciador tático offline do Plano Mestre de Evolução do Police Chief." />
  <title>PC Tracker • Evolução</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header id="app-header" class="app-header"></header>
    <main id="main-view" class="main-view" aria-live="polite"></main>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Navegação principal">
      <button type="button" class="nav-btn is-active" data-tab="today" aria-label="Hoje">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9.5"/><path d="M9.5 21v-6a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v6"/></svg>
        <span>Hoje</span>
      </button>
      <button type="button" class="nav-btn" data-tab="steps" aria-label="Etapas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="M4 6l1.2 1.2L7.5 4.8"/><path d="M4 12l1.2 1.2L7.5 10.8"/><circle cx="5.2" cy="18" r="1.1" fill="currentColor" stroke="none"/></svg>
        <span>Etapas</span>
      </button>
      <button type="button" class="nav-btn" data-tab="charts" aria-label="Gráficos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
        <span>Gráficos</span>
      </button>
      <button type="button" class="nav-btn" data-tab="data" aria-label="Dados">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="6.5" rx="7" ry="2.8"/><path d="M5 6.5v5c0 1.55 3.13 2.8 7 2.8s7-1.25 7-2.8v-5"/><path d="M5 11.5v5.5c0 1.55 3.13 2.8 7 2.8s7-1.25 7-2.8v-5.5"/></svg>
        <span>Dados</span>
      </button>
    </nav>
  </div>

  <div id="sheet-backdrop" class="sheet-backdrop" hidden>
    <section id="sheet-panel" class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
