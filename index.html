<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090D16" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Gerenciador tático offline do Plano Mestre de Evolução do Police Chief." />
  <title>PC Tracker • Evolução</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header id="app-header" class="app-header"></header>
    <main id="main-view" class="main-view" aria-live="polite"></main>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Navegação principal">
      <button type="button" class="nav-btn is-active" data-tab="today" aria-label="Hoje">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3L4 9.5V20a1 1 0 0 0 1 1h5v-6h4v6h5a1 1 0 0 0 1-1V9.5L12 3z" fill="currentColor"/></svg>
        <span>Hoje</span>
      </button>
      <button type="button" class="nav-btn" data-tab="steps" aria-label="Etapas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11v2H9V6zm0 5h11v2H9v-2zm0 5h11v2H9v-2zM4.5 5.5l1.5 1.5 2.5-2.5 1.1 1.1L6 9.2 3.4 6.6l1.1-1.1zm0 5l1.5 1.5 2.5-2.5 1.1 1.1L6 14.2l-2.6-2.6 1.1-1.1zM4 16h3v3H4v-3z" fill="currentColor"/></svg>
        <span>Etapas</span>
      </button>
      <button type="button" class="nav-btn" data-tab="charts" aria-label="Gráficos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16v2H3a1 1 0 0 1-1-1V4h2v15zm3-4l4-4 3 3 5-6 1.5 1.3-6.5 7.7-3-3-2.5 2.5L7 15z" fill="currentColor"/></svg>
        <span>Gráficos</span>
      </button>
      <button type="button" class="nav-btn" data-tab="data" aria-label="Dados">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C7.6 3 4 4.6 4 6.5v11C4 19.4 7.6 21 12 21s8-1.6 8-3.5v-11C20 4.6 16.4 3 12 3zm0 2c3.5 0 6 .9 6 1.5S15.5 8 12 8 6 7.1 6 6.5 8.5 5 12 5zm0 14c-3.5 0-6-.9-6-1.5v-2.6c1.5.7 3.6 1.1 6 1.1s4.5-.4 6-1.1v2.6c0 .6-2.5 1.5-6 1.5zm0-5c-3.5 0-6-.9-6-1.5V9.9c1.5.7 3.6 1.1 6 1.1s4.5-.4 6-1.1v2.6c0 .6-2.5 1.5-6 1.5z" fill="currentColor"/></svg>
        <span>Dados</span>
      </button>
    </nav>
  </div>

  <div id="sheet-backdrop" class="sheet-backdrop" hidden>
    <section id="sheet-panel" class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
